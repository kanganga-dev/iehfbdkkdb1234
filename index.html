<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>PixelSlash</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b1b3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PixelSlash">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="./Icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./Icons/icon-512.png">
<link rel="apple-touch-icon" href="./Icons/icon-192.png">
<style>
:root{--bg:#0b1b3a;--g:#e8c170;--d:#141a33;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
#game{width:100%;height:100%}
canvas{display:block;image-rendering:pixelated}
#tc{display:none}
.oct{clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)}
#js{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:108px;height:108px;background:var(--g);opacity:.86;touch-action:none;user-select:none;-webkit-user-select:none}
#js::before{content:"";position:absolute;inset:6px;background:var(--d);clip-path:inherit}
#js b{position:absolute;left:54px;top:54px;width:4px;height:4px;margin:-2px;background:#4a5a9a;box-shadow:0 -38px #4a5a9a,0 38px #4a5a9a,-38px 0 #4a5a9a,38px 0 #4a5a9a}
#kn{position:absolute;left:32px;top:32px;width:44px;height:44px;background:#fff3c0}
#kn::after{content:"";position:absolute;inset:5px;background:var(--g);clip-path:inherit}
.bt{position:fixed;display:grid;place-items:center;width:56px;height:56px;background:var(--d);color:var(--g);font:16px 'Press Start 2P',monospace;box-shadow:0 -4px 0 var(--g),0 4px 0 var(--g),-4px 0 0 var(--g),4px 0 0 var(--g),inset 0 4px 0 #2a3566;touch-action:none;user-select:none;-webkit-user-select:none}
.bt small{position:absolute;top:calc(100% + 10px);font-size:8px;color:#fff;text-shadow:2px 2px #000;white-space:nowrap}
.bt.on{background:var(--g);color:var(--d);transform:translateY(2px)}
#ba{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(32px + env(safe-area-inset-bottom,0px));width:64px;height:64px;color:#ff8a80}
#bj{right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px))}
#rot{display:none;position:fixed;inset:0;z-index:9;place-items:center;align-content:center;gap:28px;background:var(--bg);color:var(--g);font:16px/1.8 'Press Start 2P',monospace;text-align:center;padding:24px}
#rot u{display:block;width:40px;height:72px;border:4px solid var(--g);animation:rt 1.6s steps(4) infinite}
@keyframes rt{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:grid}}
body.menu #tc{display:none!important}
#menu{position:fixed;inset:0;z-index:8;background:#070d24;overflow:hidden;font-family:'Press Start 2P',monospace;color:#fff;user-select:none;-webkit-user-select:none;transition:opacity .9s ease,transform .9s ease}
#menu.out{opacity:0;transform:scale(1.12);pointer-events:none}
#mc{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#menu::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(4,7,18,.72),rgba(4,7,18,0) 58%),radial-gradient(ellipse at 62% 55%,transparent 45%,rgba(2,4,12,.7))}
#hd{position:absolute;left:6vw;top:5vh}
#logo{margin:0;font-weight:400;font-size:min(12.5vh,9vw);line-height:1.08;animation:drop .9s cubic-bezier(.2,1.3,.4,1) both}
#logo span{display:block;animation:flt 4s ease-in-out 1s infinite;text-shadow:-.06em 0 #0b1020,.06em 0 #0b1020,0 -.06em #0b1020,0 .06em #0b1020,-.06em -.06em #0b1020,.06em -.06em #0b1020,-.06em .06em #0b1020,.06em .06em #0b1020,0 .14em 0 #000}
#logo span:first-child{color:#f4f7fb}
#logo span:last-child{color:#ffd34d;animation-delay:1.4s;text-shadow:-.06em 0 #0b1020,.06em 0 #0b1020,0 -.06em #0b1020,-.06em -.06em #0b1020,.06em -.06em #0b1020,-.06em .06em #0b1020,.06em .06em #0b1020,0 .14em 0 #7a1020,0 .2em 0 #0b1020}
#sub{margin-top:2.6vh;font-size:max(7px,1.7vh);color:#9fd3ff;text-shadow:2px 2px #000;animation:fade 1s .9s both}
#mn{position:absolute;left:6vw;bottom:12vh;display:flex;flex-direction:column;gap:2.6vh}
.mi{all:unset;cursor:pointer;display:flex;align-items:center;gap:1.4vh;font-family:inherit;font-size:max(11px,3.3vh);text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,3px 3px #000;color:#e9eef7;opacity:0;transform:translateX(-5vw);animation:slin .6s ease-out var(--d) forwards;transition:color .15s,margin-left .2s}
.mi svg{width:3.6vh;height:1.2vh;opacity:0;margin-left:-4.6vh;transition:opacity .15s}
.mi.on{color:#ffd34d;margin-left:4.6vh}.mi.on svg{opacity:1;animation:bob .7s ease-in-out infinite alternate}
.mi.dis{color:#6f7890}
#hint{position:absolute;left:6vw;bottom:4vh;font-size:max(7px,1.5vh);color:#8fa3c8;text-shadow:2px 2px #000;animation:fade 1s 1.4s both}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}#fl.on{opacity:1}
#ts{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);background:#141a33;color:#ffd34d;padding:1.4vh 2vw;font-size:max(8px,1.7vh);opacity:0;transition:opacity .3s;box-shadow:0 0 0 3px var(--g);pointer-events:none;white-space:nowrap}#ts.on{opacity:1}
#pn{position:absolute;inset:0;display:none;place-items:center;background:rgba(3,6,16,.6)}#pn.on{display:grid;animation:fade .25s both}
.pnl{background:#141a33;width:min(94vw,760px);padding:3vh 3vw;box-sizing:border-box;max-height:90vh;overflow:hidden;box-shadow:0 -4px 0 var(--g),0 4px 0 var(--g),-4px 0 0 var(--g),4px 0 0 var(--g),inset 0 4px 0 #2a3566,0 10px 0 rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.2,1.2,.4,1) both}
.pt{font-size:max(12px,3.2vh);color:var(--g);text-align:center;margin-bottom:2.4vh;text-shadow:2px 2px #000}
.cards{display:flex;gap:2vw;justify-content:center;margin-bottom:2.4vh}
.card{flex:1;max-width:30%;background:#0b1020;padding:1vh;text-align:center;font-size:max(6px,1.4vh);line-height:1.7;box-shadow:0 0 0 3px #2a3566}
.card.sel{box-shadow:0 0 0 3px var(--g);animation:glow 1.2s ease-in-out infinite alternate}.card.lock{opacity:.55}
.card canvas,.card .lk{width:100%;aspect-ratio:16/9;display:block;image-rendering:pixelated;margin-bottom:.8vh}
.lk{display:grid;place-items:center;background:#0b1020;color:#4a5a9a;font-size:4vh}
.card b{display:block;font-weight:400}.card small{color:#8fa3c8}
.prep{display:flex;gap:1.6vw;justify-content:center;align-items:center;margin-bottom:2.4vh;font-size:max(7px,1.5vh);color:#9fd3ff;flex-wrap:wrap}
.gd{font-size:max(7px,1.5vh);line-height:2.2;color:#cfd8ea;text-align:center;margin-bottom:2.4vh}
.row{display:flex;gap:2vw;justify-content:center}
.pb{all:unset;cursor:pointer;display:inline-block;text-align:center;font-family:inherit;font-size:max(8px,1.9vh);padding:1.4vh 2.2vw;background:#0b1020;color:#e9eef7;box-shadow:0 -3px 0 #4a5a9a,0 3px 0 #4a5a9a,-3px 0 0 #4a5a9a,3px 0 0 #4a5a9a;transition:transform .15s,background .15s,color .15s}
.pb.go{color:#9bf0a0}.pb.on{background:var(--g);color:var(--d);transform:translateY(-2px);box-shadow:0 -3px 0 #fff3c0,0 3px 0 #fff3c0,-3px 0 0 #fff3c0,3px 0 0 #fff3c0}
@keyframes slin{to{opacity:1;transform:none}}
@keyframes drop{from{transform:translateY(-16vh);opacity:0}}
@keyframes flt{50%{transform:translateY(.9vh)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.9) translateY(3vh);opacity:0}}
@keyframes glow{to{box-shadow:0 0 0 3px #fff3c0,0 0 14px 2px rgba(255,211,77,.5)}}
@keyframes bob{to{transform:translateX(.8vh)}}

/* ===== v7: kontrol bulat, sprint, jeda, menu lebih besar ===== */
:root{--op:.8}
#js{opacity:var(--op)}
#jr{position:absolute;left:20px;top:20px;width:68px;height:68px;background:#3a4a8a;pointer-events:none}
#jr::before{content:"";position:absolute;inset:3px;background:var(--d);clip-path:inherit}
#js.sp #jr{background:#ff7a3a}
#js.sp #kn{background:#ffe2b8}
#js.sp #kn::after{background:#ff7a3a}
#spl{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(134px + env(safe-area-inset-bottom,0px));width:108px;text-align:center;font:8px 'Press Start 2P',monospace;color:#ffb27a;text-shadow:2px 2px #000;opacity:0;transition:opacity .12s;pointer-events:none}
#spl.on{opacity:1}
.bt{border-radius:50%;background:radial-gradient(circle at 50% 32%,#2b3a6e,var(--d) 72%);box-shadow:0 0 0 4px var(--g),0 0 0 7px #0b1020,inset 0 5px 0 rgba(255,255,255,.1),inset 0 -6px 0 rgba(0,0,0,.35);opacity:var(--op)}
.bt svg{width:56%;height:56%;display:block}
.bt.on{background:var(--g);color:var(--d);transform:scale(.93);box-shadow:0 0 0 4px #fff3c0,0 0 0 7px #0b1020}
#bj{width:68px;height:68px;right:calc(122px + env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));color:#9fe8ff}
#ba{width:84px;height:84px;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));color:#ff8a80}
#ba::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(255,138,128,.75);pointer-events:none}
#ba.cd::after{animation:ping .33s ease-out}
#ba .cdr{position:absolute;left:-5px;top:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg);pointer-events:none;overflow:visible}
#ba .cdr circle{fill:none;stroke:#fff3c0;stroke-width:2.2;stroke-dasharray:100.53;stroke-dashoffset:100.53}
#ba.cd .cdr circle{animation:cdr .33s linear}
@keyframes cdr{from{stroke-dashoffset:0}to{stroke-dashoffset:100.53}}
@keyframes ping{to{box-shadow:0 0 0 16px rgba(255,138,128,0)}}
#pb{position:fixed;z-index:6;display:grid;place-items:center;width:40px;height:40px;padding:0;background:#0a1730;border:2px solid #e8c170;border-radius:7px;box-shadow:inset 0 0 0 3px #1a2a4a,0 3px 0 rgba(0,0,0,.4);color:#e8c170;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
#pb svg{width:42%;height:42%;display:block}
#pb:active{background:var(--g);color:var(--d)}
body.menu #pb,body.paused #pb{display:none}
#pz{position:fixed;inset:0;z-index:7;display:none;place-items:center;background:rgba(3,6,16,.62);font-family:'Press Start 2P',monospace;color:#fff;user-select:none;-webkit-user-select:none}
#pz.on{display:grid;animation:fade .25s both}
#pz .pnl{width:min(86vw,640px)}
.col{display:flex;flex-direction:column;gap:2vh;align-items:stretch;margin:0 auto;max-width:70%}
.col .pb{padding:1.8vh 3vw}
.pb.sm{min-width:4.4vh;padding:1.2vh 1.6vw;font-size:max(12px,2.8vh)}
.opn{font-weight:400;min-width:5ch;text-align:center;color:#ffd34d}
.opv{position:relative;display:inline-block;width:5.4vh;height:5.4vh;background:var(--g)}
.opv::before{content:"";position:absolute;inset:12%;background:var(--d);clip-path:inherit}
.opv i{position:absolute;left:32%;top:32%;width:36%;height:36%;background:#fff3c0}
/* menu awal: lebih besar & lebar */
#hd{left:7vw;top:6vh}
#logo{font-size:min(15vh,10.5vw)}
#sub{margin-top:3vh;font-size:max(8px,2.1vh);letter-spacing:.06em}
#mn{left:7vw;bottom:10vh;gap:1.4vh}
.mi{font-size:max(14px,4.6vh);gap:1.8vh;min-width:38vw;box-sizing:border-box;padding:1vh 3vw 1vh 1.4vw}
.mi svg{width:4.8vh;height:1.6vh;margin-left:-6vh}
.mi.on{margin-left:6vh;background:linear-gradient(90deg,rgba(255,211,77,.22),rgba(255,211,77,0))}
#hint{left:7vw;bottom:3.4vh;font-size:max(8px,1.9vh)}
#ts{font-size:max(9px,2.1vh)}
.pnl{width:min(94vw,940px);max-height:94vh;overflow-y:auto;scrollbar-width:none}
.pnl::-webkit-scrollbar{display:none}
.pt{font-size:max(14px,4.2vh)}
.card{font-size:max(7px,1.7vh)}
.prep,.gd{font-size:max(8px,1.8vh)}
.pb{font-size:max(10px,2.3vh);padding:1.6vh 2.6vw}
.pb.sm{padding:1.2vh 1.6vw}
</style>
</head>
